<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT for Little Minds — Grade 3 Games</title>
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Comic Neue","Baloo 2","Comic Sans MS","Chalkboard SE","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
    background:linear-gradient(180deg,#E6F4F1,#CDEAE3); color:#173F3A; min-height:100vh; text-align:center;}
  body::before, body::after{
    content:""; position:fixed; left:0; right:0; height:14px; z-index:5; pointer-events:none;
    background-image:
      radial-gradient(circle at 10px 7px, #0F766E 4.5px, transparent 5px),
      radial-gradient(circle at 34px 7px, #E8A020 4.5px, transparent 5px),
      radial-gradient(circle at 58px 7px, #C0267B 4.5px, transparent 5px);
    background-size:72px 14px; background-repeat:repeat-x;
  }
  body::before{top:0;} body::after{bottom:0;}
  header{padding:30px 14px 6px;}
  .book{font-size:15px; font-weight:800; letter-spacing:2.5px; color:#0F766E;}
  h1{font-size:clamp(26px,7vw,38px); font-weight:800; color:#115E59; margin-top:2px;}
  .tag{font-size:16.5px; font-weight:700; color:#4E7268; margin-top:6px;}
  .hero{width:min(78vw,320px); border-radius:26px; border:4px solid #fff;
    box-shadow:0 12px 28px rgba(17,94,89,.22); margin:14px auto 4px; display:block;}
  .wrap{max-width:640px; margin:0 auto; padding:14px;}
  .unit{font-size:15px; font-weight:800; letter-spacing:1.5px; color:#fff; background:#0F766E;
    border-radius:999px; padding:8px 16px; margin:18px 0 12px; box-shadow:0 4px 0 #115E59;}
  .unit small{display:block; font-size:12.5px; letter-spacing:.5px; font-weight:700; color:#E6F4F1;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{background:#fff; border-radius:20px; padding:16px 10px 14px; box-shadow:0 6px 16px rgba(17,94,89,.14);
    text-decoration:none; color:#173F3A; display:block; border:3px solid #E8F1FE;
    transition:transform .15s;}
  .card:active{transform:scale(.97);}
  .card .n{font-size:12.5px; font-weight:800; letter-spacing:1.5px; color:#C0267B;}
  .card .t{font-size:17.5px; font-weight:800; line-height:1.2; margin-top:3px; color:#115E59;}
  .card .play{display:inline-block; margin-top:9px; background:#0F766E; color:#fff; font-weight:800;
    border-radius:999px; padding:7px 18px; font-size:15px; box-shadow:0 4px 0 #115E59;}
  .note{background:#FFF7E0; border:3px solid #E8A020; border-radius:20px; color:#7A5410;
    font-weight:700; font-size:14.5px; padding:10px 14px; margin:20px 0 4px;}
  footer{padding:8px 14px 30px; font-size:13.5px; font-weight:700; color:#5F857B; line-height:1.6;}
  footer .credit{color:#8A6D1C; font-size:13px;}
</style>
</head>
<body>
<header>
  <div class="book">ICT FOR LITTLE MINDS — GRADE 3</div>
  <h1>🎮 Chapter Games</h1>
  <p class="tag">One game for every chapter — your robot friend plays with you!<br>Scan the QR code in your book, then tap your chapter.</p>
</header>
<img class="hero" src="img/g3c1-bolt-stage.jpg" alt="Bolt, your robot friend, ready to play the Grade 3 chapter games">
<div class="wrap" id="wrap"></div>
<footer>
  Free to play · No ads · No logins — just play together.<br>
  <span class="credit">✦ Prepared by: Zulfiqar Ali Sajid ✦</span>
</footer>
<script>
var UNITS = [
  {name:"UNIT 1", title:"Storing and Organising", chapters:[
    "Storage Devices", "Files and Folders" ]},
  {name:"UNIT 2", title:"Typing and Word Processing", chapters:[
    "Typing Skills", "Create and Save Documents", "Edit and Format Documents" ]},
  {name:"UNIT 3", title:"Data Detective", chapters:[
    "Collecting Data", "Tally Marks and Tables" ]},
  {name:"UNIT 4", title:"My First Programs", chapters:[
    "My First Programs", "Movement and Sounds in Scratch" ]},
  {name:"UNIT 5", title:"Smart Machines", chapters:[
    "AI Around Us", "Solving Puzzles with AI" ]},
  {name:"UNIT 6", title:"Staying Safe", chapters:[
    "Personal Data Safety" ]}
];
var wrap = document.getElementById("wrap");
var cn = 0;
UNITS.forEach(function(u){
  var h = document.createElement("div");
  h.className = "unit";
  h.innerHTML = u.name + "<small>" + u.title + "</small>";
  wrap.appendChild(h);
  var grid = document.createElement("div");
  grid.className = "grid";
  wrap.appendChild(grid);
  u.chapters.forEach(function(title){
    cn++;
    var n = cn;
    var a = document.createElement("a");
    a.className = "card"; a.href = "c" + n + ".html";
    a.innerHTML = '<div class="n">CHAPTER ' + n + '</div><div class="t">' + title +
      '</div><span class="play">▶ Play!</span>';
    grid.appendChild(a);
  });
});
var note = document.createElement("div");
note.className = "note";
note.textContent = "⭐ Tap a chapter card to play its game!";
wrap.appendChild(note);
</script>
</body>
</html>
